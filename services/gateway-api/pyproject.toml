[project]
name = "llm-quality-observer-gateway-api"
version = "0.1.0"
description = "Gateway API for LLM Quality Observer"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "psycopg2-binary",
  "pydantic>=2.0",
  "pydantic-settings",
  "httpx",
  "python-dotenv",
  "openai",
  "litellm>=1.0.0",
  "prometheus-client>=0.19.0",
  # Authentication (v0.8.0)
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<5.0.0",  # Fix compatibility with passlib
  "python-multipart>=0.0.6",
  "email-validator>=2.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# uv 관련 설정 필요하면 나중에 추가
